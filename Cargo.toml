[package]
name = "tombolo"
version = "0.1.0"
edition = "2021"
description = "Linux auditd ingest with cross-tree data provenance and a TUI graph view"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
